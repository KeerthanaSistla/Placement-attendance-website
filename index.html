<!DOCTYPE html>
<html lang="en">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Placement Attendance</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f3f7f4;
      color: #374151;
    }


    /* =========================================
       CONTAINER
    ========================================= */

    .container {
      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      padding:
        32px 18px 50px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      position: relative;

      background: #ffffff;

      border:
        1px solid #e1e7e3;

      border-radius: 14px;

      padding:
        30px 30px 26px;

      margin-bottom: 16px;

      overflow: hidden;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.05);
    }


    .header::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 5px;

      background: #8fc9a8;
    }


    .header h1 {
      margin:
        4px 0 10px;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: -0.4px;

      color: #26352c;
    }


    .header p {
      margin:
        7px 0;

      font-size: 14px;

      line-height: 1.6;

      color: #6b7280;
    }


    .header p strong {
      color: #4b5563;
    }


    /* =========================================
       MESSAGE
    ========================================= */

    .message {
      display: none;

      padding:
        15px 17px;

      margin-bottom: 16px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.5;

      border:
        1px solid transparent;

      animation:
        messageSlide 0.25s ease;
    }


    .success {
      background: #edf8f1;
      color: #2f6b45;
      border-color: #c5e5d0;
    }


    .error {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }


    @keyframes messageSlide {

      from {
        opacity: 0;
        transform:
          translateY(-6px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }


    /* =========================================
       CARD
    ========================================= */

    .card {
      background: #ffffff;

      border:
        1px solid #e1e7e3;

      border-radius: 12px;

      padding:
        25px 28px;

      margin-bottom: 14px;

      box-shadow:
        0 2px 9px
        rgba(0, 0, 0, 0.035);

      transition:
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }


    .card:hover {
      border-color: #cbd8d0;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, 0.05);
    }


    /* =========================================
       QUESTIONS
    ========================================= */

    .question {
      margin-bottom: 28px;
    }


    .question:last-child {
      margin-bottom: 0;
    }


    label {
      display: block;

      margin-bottom: 10px;

      font-size: 14px;

      font-weight: 600;

      color: #374151;
    }


    .required {
      color: #dc2626;

      margin-left: 2px;
    }


    /* =========================================
       INPUTS
    ========================================= */

    input[type="text"],
    input[type="date"],
    input[type="url"],
    select {

      width: 100%;

      height: 48px;

      padding:
        0 14px;

      border:
        1px solid #cfd8d2;

      border-radius: 8px;

      background: #ffffff;

      color: #374151;

      font-family: inherit;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    input::placeholder {
      color: #9ca3af;
    }


    input[type="text"]:hover,
    input[type="date"]:hover,
    input[type="url"]:hover,
    select:hover {

      border-color: #9bb9a5;
    }


    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="url"]:focus,
    select:focus {

      border-color: #76ad8d;

      box-shadow:
        0 0 0 3px
        rgba(118, 173, 141, 0.14);

      background: #ffffff;
    }


    /* =========================================
       DATE
    ========================================= */

    input[type="date"] {
      cursor: pointer;
    }


    input[type="date"]::-webkit-calendar-picker-indicator {

      cursor: pointer;

      opacity: 0.55;

      width: 18px;
      height: 18px;
    }


    /* =========================================
       SELECT
    ========================================= */

    select {

      appearance: none;

      -webkit-appearance: none;

      cursor: pointer;

      padding-right: 42px;

      background-image:

        linear-gradient(
          45deg,
          transparent 50%,
          #6b7280 50%
        ),

        linear-gradient(
          135deg,
          #6b7280 50%,
          transparent 50%
        );

      background-position:

        calc(100% - 18px) 20px,
        calc(100% - 13px) 20px;

      background-size:
        5px 5px,
        5px 5px;

      background-repeat:
        no-repeat;
    }


    select:disabled {

      background-color: #f5f7f6;

      color: #9ca3af;

      cursor: not-allowed;

      border-color: #e1e7e3;
    }


    /* =========================================
       EVENT INFO
    ========================================= */

    .event-info {

      display: none;

      margin-top: 10px;

      padding:
        11px 14px;

      background: #f0f8f3;

      border:
        1px solid #cfe5d6;

      border-radius: 8px;

      color: #52705d;

      font-size: 13px;

      line-height: 1.5;
    }


    .no-events {

      margin-top: 10px;

      padding:
        12px 14px;

      background: #f7f7f7;

      border:
        1px solid #dedede;

      border-radius: 8px;

      color: #666666;

      font-size: 13px;

      line-height: 1.5;
    }


    .event-loading {

      margin-top: 9px;

      color: #7a847e;

      font-size: 13px;
    }


    /* =========================================
       SPINNER
    ========================================= */

    .spinner {

      display: inline-block;

      width: 14px;
      height: 14px;

      margin-right: 7px;

      border:
        2px solid
        rgba(255,255,255,0.4);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;

      vertical-align: -2px;
    }


    .event-loading .spinner {

      border-color: #d5e7db;

      border-top-color: #76ad8d;
    }


    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================================
       RADIO
    ========================================= */

    .radio-option {

      display: flex;

      align-items: center;

      min-height: 42px;

      margin: 6px 0;

      padding:
        8px 11px;

      border:
        1px solid transparent;

      border-radius: 8px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }


    .radio-option:hover {

      background: #f4f9f6;

      border-color: #dcebe1;
    }


    .radio-option input {

      appearance: none;

      -webkit-appearance: none;

      width: 19px;
      height: 19px;

      margin:
        0 11px 0 0;

      border:
        2px solid #9ca3af;

      border-radius: 50%;

      cursor: pointer;

      position: relative;

      flex-shrink: 0;
    }


    .radio-option input:checked {

      border-color: #76ad8d;
    }


    .radio-option input:checked::after {

      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      background: #76ad8d;

      border-radius: 50%;

      top: 3px;
      left: 3px;
    }


    .radio-option span {

      font-size: 14px;

      color: #4b5563;

      cursor: pointer;
    }


    /* =========================================
       CHECKBOX
    ========================================= */

    .checkbox-option {

      display: flex;

      align-items: center;

      min-height: 42px;

      margin: 5px 0;

      padding:
        8px 11px;

      border:
        1px solid transparent;

      border-radius: 8px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }


    .checkbox-option:hover {

      background: #f4f9f6;

      border-color: #dcebe1;
    }


    .checkbox-option input {

      appearance: none;

      -webkit-appearance: none;

      width: 19px;
      height: 19px;

      margin:
        0 11px 0 0;

      border:
        2px solid #9ca3af;

      border-radius: 5px;

      cursor: pointer;

      position: relative;

      flex-shrink: 0;
    }


    .checkbox-option input:checked {

      background: #76ad8d;

      border-color: #76ad8d;
    }


    .checkbox-option input:checked::after {

      content: "✓";

      position: absolute;

      color: #ffffff;

      font-size: 13px;

      font-weight: 700;

      left: 3px;
      top: -1px;
    }


    .checkbox-option span {

      font-size: 14px;

      color: #4b5563;

      cursor: pointer;
    }


    /* =========================================
       HELPER
    ========================================= */

    .helper-text {

      margin-top: 8px;

      font-size: 12px;

      color: #7a847e;

      line-height: 1.5;

      overflow-wrap: anywhere;
    }


    .helper-text b {
      color: #5d6962;
    }


    .helper-text a {

      color: #5f9878;

      text-decoration: none;
    }


    .helper-text a:hover {
      text-decoration: underline;
    }


    /* =========================================
       SUBMIT
    ========================================= */

    .submit-container {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;
    }


    button {

      border: none;

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }


    button:active {

      transform:
        translateY(1px);
    }


    .submit-button {

      min-width: 110px;

      height: 44px;

      padding:
        0 22px;

      background: #6fa889;

      color: #ffffff;

      border-radius: 8px;

      box-shadow:
        0 3px 8px
        rgba(92, 137, 108, 0.22);
    }


    .submit-button:hover {

      background: #5f9878;

      box-shadow:
        0 5px 12px
        rgba(92, 137, 108, 0.28);
    }


    .submit-button:disabled {

      background: #a9c8b5;

      cursor: not-allowed;

      box-shadow: none;
    }


    .clear-button {

      background: transparent;

      color: #6b7280;

      padding:
        10px 12px;

      border-radius: 8px;
    }


    .clear-button:hover {

      background: #f1f4f2;

      color: #4b5563;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .container {

        padding:
          12px 10px 30px;
      }


      .header {

        border-radius: 12px;

        padding:
          26px 20px 22px;

        margin-bottom: 10px;
      }


      .header h1 {
        font-size: 23px;
      }


      .header p {
        font-size: 13px;
      }


      .card {

        border-radius: 11px;

        padding:
          20px 18px;

        margin-bottom: 10px;
      }


      .question {
        margin-bottom: 24px;
      }


      .submit-container {

        flex-direction: row;

        gap: 10px;
      }


      .submit-button {

        flex: 1;

        height: 46px;
      }

    }


    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-width: 380px) {

      .header h1 {
        font-size: 21px;
      }


      .card {

        padding:
          18px 15px;
      }


      .submit-container {

        flex-direction:
          column-reverse;

        align-items:
          stretch;
      }


      .clear-button {

        text-align: center;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      IT Placement Attendance
    </h1>

    <p>
      Please fill the form to record your placement attendance.
    </p>

    <p>
      <strong>
        Entries will be verified.
      </strong>
    </p>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message">
  </div>


  <!-- FORM -->

  <form
    id="attendanceForm"
    novalidate>


    <!-- BASIC DETAILS -->

    <div class="card">


      <!-- FULL NAME -->

      <div class="question">

        <label for="fullName">

          Full Name

          <span class="required">
            *
          </span>

        </label>


        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required>

      </div>


      <!-- ROLL NUMBER -->

      <div class="question">

        <label for="rollNumber">

          Roll Number

          <span class="required">
            *
          </span>

        </label>


        <input
          type="text"
          id="rollNumber"
          placeholder="160123737XXX"
          required>

      </div>


      <!-- SECTION -->

      <div class="question">

        <label>

          Section

          <span class="required">
            *
          </span>

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="section"
            value="IT1">

          <span>
            IT1
          </span>

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="section"
            value="IT2">

          <span>
            IT2
          </span>

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="section"
            value="IT3">

          <span>
            IT3
          </span>

        </label>

      </div>


    </div>


    <!-- DATE + EVENT -->

    <div class="card">


      <!-- DATE -->

      <div class="question">

        <label for="date">

          Date

          <span class="required">
            *
          </span>

        </label>


        <input
          type="date"
          id="date"
          required>

      </div>


      <!-- EVENT -->

      <div class="question">

        <label for="event">

          Event Name

          <span class="required">
            *
          </span>

        </label>


        <select
          id="event"
          required
          disabled>

          <option value="">
            First select a date
          </option>

        </select>


        <div
          id="eventLoading"
          class="event-loading"
          style="display:none;">

          <span class="spinner"></span>

          Loading events...

        </div>


        <div
          id="noEvents"
          class="no-events"
          style="display:none;">

          No events were found
          for this date.

        </div>


        <div
          id="eventInfo"
          class="event-info">
        </div>

      </div>


    </div>


    <!-- CLASS HOURS -->

    <div class="card">

      <div class="question">

        <label>

          Class Hours Attended

          <span class="required">
            *
          </span>

        </label>


        <label class="checkbox-option">

          <input
            type="checkbox"
            name="hours"
            value="1st Hour">

          <span>
            1st Hour
          </span>

        </label>


        <label class="checkbox-option">

          <input
            type="checkbox"
            name="hours"
            value="2nd Hour">

          <span>
            2nd Hour
          </span>

        </label>


        <label class="checkbox-option">

          <input
            type="checkbox"
            name="hours"
            value="3rd Hour">

          <span>
            3rd Hour
          </span>

        </label>


        <label class="checkbox-option">

          <input
            type="checkbox"
            name="hours"
            value="4th Hour">

          <span>
            4th Hour
          </span>

        </label>


        <label class="checkbox-option">

          <input
            type="checkbox"
            name="hours"
            value="5th Hour">

          <span>
            5th Hour
          </span>

        </label>


        <label class="checkbox-option">

          <input
            type="checkbox"
            name="hours"
            value="6th Hour">

          <span>
            6th Hour
          </span>

        </label>

      </div>

    </div>


    <!-- PROOF -->

    <div class="card">

      <div class="question">

        <label for="proofLink">

          Proof
          (public view access Drive link)

          <span class="required">
            *
          </span>

        </label>


        <input
          type="url"
          id="proofLink"
          placeholder="https://drive.google.com/file/d/..."
          required>


        <div class="helper-text">

          <b>Drive folder:</b>

          <a
            href="https://drive.google.com/drive/folders/1uGUqN0h2Ftk8oZZXTQ_l9-QNonOktQwK?usp=drive_link"
          >

            Open Drive Folder

          </a>

        </div>

      </div>

    </div>


    <!-- SUBMIT -->

    <div class="card">

      <div class="submit-container">

        <button
          type="button"
          class="clear-button"
          onclick="clearForm()">

          Clear form

        </button>


        <button
          type="submit"
          id="submitButton"
          class="submit-button">

          Submit

        </button>

      </div>

    </div>


  </form>


</div>


<script>


// =====================================================
// GLOBAL
// =====================================================

let allEvents = [];


// =====================================================
// LOAD EVENTS
// =====================================================

function loadEvents() {

  google.script.run

    .withSuccessHandler(function(events) {

      allEvents =
        Array.isArray(events)
          ? events
          : [];

    })

    .withFailureHandler(function(error) {

      showMessage(
        "Could not load events: " +
        getErrorMessage(error),
        "error"
      );

    })

    .getEvents();

}


loadEvents();


// =====================================================
// DATE CHANGE
// =====================================================

document
  .getElementById("date")
  .addEventListener(
    "change",
    function() {

      updateEventDropdown(
        this.value
      );

    }
  );


// =====================================================
// UPDATE EVENT DROPDOWN
// =====================================================

function updateEventDropdown(
  selectedDate
) {

  const eventSelect =
    document.getElementById("event");

  const loading =
    document.getElementById("eventLoading");

  const noEvents =
    document.getElementById("noEvents");

  const eventInfo =
    document.getElementById("eventInfo");


  eventSelect.innerHTML =
    '<option value="">Select an event</option>';

  eventSelect.disabled =
    true;


  noEvents.style.display =
    "none";

  eventInfo.style.display =
    "none";


  if (!selectedDate) {

    eventSelect.innerHTML =
      '<option value="">First select a date</option>';

    return;
  }


  loading.style.display =
    "block";


  const matchingEvents =
    allEvents.filter(function(item) {

      return (
        item.date ===
        selectedDate
      );

    });


  loading.style.display =
    "none";


  if (
    matchingEvents.length === 0
  ) {

    noEvents.style.display =
      "block";

    return;
  }


  matchingEvents.forEach(function(item) {

    const option =
      document.createElement("option");


    option.value =
      item.company +
      "|||" +
      item.event;


    option.textContent =
      item.display;


    eventSelect.appendChild(
      option
    );

  });


  eventSelect.disabled =
    false;

}


// =====================================================
// EVENT CHANGE
// =====================================================

document
  .getElementById("event")
  .addEventListener(
    "change",
    function() {

      const info =
        document.getElementById(
          "eventInfo"
        );


      if (!this.value) {

        info.style.display =
          "none";

        return;
      }


      const selected =
        parseEventValue(
          this.value
        );


      info.textContent =
        "Company: " +
        selected.company;


      info.style.display =
        "block";

    }
  );


// =====================================================
// PARSE EVENT
// =====================================================

function parseEventValue(
  value
) {

  const parts =
    String(value)
      .split("|||");


  return {

    company:
      String(
        parts[0] || ""
      ).trim(),

    event:
      String(
        parts.slice(1).join("|||") || ""
      ).trim()

  };

}


// =====================================================
// FORM SUBMISSION
// =====================================================

document
  .getElementById("attendanceForm")
  .addEventListener(
    "submit",
    function(e) {

      e.preventDefault();


      const submitButton =
        document.getElementById(
          "submitButton"
        );


      // -------------------------------------------------
      // FULL NAME
      // -------------------------------------------------

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();


      if (!fullName) {

        showMessage(
          "Please enter your full name.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // ROLL NUMBER
      // -------------------------------------------------

      const rollNumber =
        document
          .getElementById("rollNumber")
          .value
          .trim();


      if (!rollNumber) {

        showMessage(
          "Please enter your roll number.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // SECTION
      // -------------------------------------------------

      const sectionElement =
        document.querySelector(
          'input[name="section"]:checked'
        );


      if (!sectionElement) {

        showMessage(
          "Please select your section.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // DATE
      // -------------------------------------------------

      const date =
        document
          .getElementById("date")
          .value
          .trim();


      if (!date) {

        showMessage(
          "Please select a date.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // EVENT
      // -------------------------------------------------

      const eventSelect =
        document.getElementById(
          "event"
        );


      if (!eventSelect.value) {

        showMessage(
          "Please select an event.",
          "error"
        );

        return;
      }


      const selectedEvent =
        parseEventValue(
          eventSelect.value
        );


      if (
        !selectedEvent.company ||
        !selectedEvent.event
      ) {

        showMessage(
          "Please select a valid event.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // HOURS
      // -------------------------------------------------

      const hours =
        Array.from(
          document.querySelectorAll(
            'input[name="hours"]:checked'
          )
        )
        .map(function(element) {

          return element.value;

        });


      if (hours.length === 0) {

        showMessage(
          "Please select at least one class hour.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // PROOF
      // -------------------------------------------------

      const proofLink =
        document
          .getElementById("proofLink")
          .value
          .trim();


      if (!proofLink) {

        showMessage(
          "Please enter your proof link.",
          "error"
        );

        return;
      }


      if (
        !/^https?:\/\//i.test(
          proofLink
        )
      ) {

        showMessage(
          "Please enter a valid proof link.",
          "error"
        );

        return;
      }


      // -------------------------------------------------
      // FORM DATA
      // -------------------------------------------------

      const formData = {

        fullName:
          fullName,

        rollNumber:
          rollNumber,

        section:
          sectionElement.value,

        date:
          date,

        company:
          selectedEvent.company,

        event:
          selectedEvent.event,

        hours:
          hours,

        proofLink:
          proofLink

      };


      // -------------------------------------------------
      // BUTTON
      // -------------------------------------------------

      submitButton.disabled =
        true;

      submitButton.innerHTML =
        '<span class="spinner"></span>Submitting...';


      hideMessage();


      // =================================================
      // IMPORTANT
      //
      // First call:
      //     ONLY adds response row.
      //
      // This is fast.
      // =================================================

      google.script.run

        .withSuccessHandler(
          function(response) {

            // -------------------------------------------
            // SHOW SUCCESS IMMEDIATELY
            // -------------------------------------------

            showMessage(
              response &&
              response.message
                ? response.message
                : "Attendance submitted successfully.",
              "success"
            );


            clearForm(false);

            resetSubmitButton();


            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });


            // -------------------------------------------
            // BACKGROUND MIRROR
            //
            // We DO NOT wait for this.
            // -------------------------------------------

            if (
              response &&
              response.row
            ) {

              google.script.run

                .withFailureHandler(
                  function(error) {

                    console.log(
                      "Background sync failed:",
                      getErrorMessage(error)
                    );

                  }
                )

                .syncResponseRow(
                  response.row
                );

            }

          }
        )

        .withFailureHandler(
          function(error) {

            showMessage(
              getErrorMessage(error),
              "error"
            );

            resetSubmitButton();

          }
        )

        .submitAttendance(
          formData
        );

    }
  );


// =====================================================
// CLEAR FORM
// =====================================================

function clearForm(
  hideMessageAfterClear = true
) {

  document
    .getElementById(
      "attendanceForm"
    )
    .reset();


  const eventSelect =
    document.getElementById(
      "event"
    );


  eventSelect.innerHTML =
    '<option value="">First select a date</option>';

  eventSelect.disabled =
    true;


  document
    .getElementById(
      "eventInfo"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "noEvents"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "eventLoading"
    )
    .style.display =
    "none";


  if (
    hideMessageAfterClear
  ) {

    hideMessage();

  }

}


// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    String(
      text || ""
    );


  message.className =
    "message " +
    type;


  message.style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// =====================================================
// HIDE MESSAGE
// =====================================================

function hideMessage() {

  document
    .getElementById(
      "message"
    )
    .style.display =
    "none";

}


// =====================================================
// RESET BUTTON
// =====================================================

function resetSubmitButton() {

  const button =
    document.getElementById(
      "submitButton"
    );


  button.disabled =
    false;


  button.textContent =
    "Submit";

}


// =====================================================
// ERROR MESSAGE
// =====================================================

function getErrorMessage(
  error
) {

  if (!error) {
    return "An unknown error occurred.";
  }


  if (
    typeof error === "string"
  ) {
    return error;
  }


  if (error.message) {
    return error.message;
  }


  return String(error);

}

</script>
